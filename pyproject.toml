[project]
name = "pytorch-lightning-learning"
version = "0.1.0"
description = "PyTorch Lightning 循序渐进学习项目"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "torchvision>=0.15.0",
    "tensorboard>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "ipywidgets>=8.0.0",
]
